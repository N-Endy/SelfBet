name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SelfBet.sln
      - name: Build
        run: dotnet build SelfBet.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SelfBet.sln --configuration Release --no-build --verbosity normal
