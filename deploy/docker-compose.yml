services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: selfbet
      POSTGRES_PASSWORD: selfbet
      POSTGRES_DB: selfbet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: src/SelfBet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Scheduler__TimeZone: Africa/Lagos
      SportyBet__DryRun: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: ..
      dockerfile: src/SelfBet.Dashboard/Dockerfile
    environment:
      Api__BaseUrl: http://api:8080
    ports:
      - "8090:8090"
    depends_on:
      - api

volumes:
  postgres_data:
